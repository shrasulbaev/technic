# Free test server on Render (render.com): New → Blueprint → this repo.
# Seeds demo accounts on first start. Free instances sleep after 15 minutes
# idle (the first open then takes about a minute), and Render's free database
# is removed after 30 days. For real use, deploy with docker-compose.yml.
services:
  - type: web
    name: technic
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: technic-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "1"
      - key: DEMO_MODE
        value: "1"
      - key: SMS_PROVIDER
        value: stub
      - key: ADMIN_PHONES
        value: "+996555000001"

databases:
  - name: technic-db
    plan: free
    region: frankfurt
    databaseName: technic
    user: technic
