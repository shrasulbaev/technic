# Free test server on Render (render.com): New → Blueprint → this repo.
# Render allows one free database per account, so the database lives outside
# Render (a free Supabase or Neon Postgres): paste its connection string into
# DATABASE_URL when Render asks. For Supabase use the session pooler string
# (port 5432) and add ?sslmode=no-verify.
# Seeds demo accounts on first start. Free instances sleep after 15 minutes
# idle (the first open then takes about a minute). For real use, deploy with
# docker-compose.yml.
services:
  - type: web
    name: technic
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "1"
      - key: DEMO_MODE
        value: "1"
      - key: SMS_PROVIDER
        value: stub
      - key: ADMIN_PHONES
        value: "+996555000001"

